name: Collect news candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: news-watch
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: .watch
          key: news-watch-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-watch-
      - name: Collect candidates
        run: npm run news:watch
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .watch
          key: news-watch-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-candidates-${{ github.run_id }}
          path: .watch/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
